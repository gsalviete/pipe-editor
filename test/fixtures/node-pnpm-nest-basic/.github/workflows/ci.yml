# Demo workflow bundled with the fixture so the "visualize existing
# CI" flow works out of the box: pipe-editor converts this into an
# editable, locally runnable pipeline.
name: Fixture CI
on:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - uses: codecov/codecov-action@v4
  build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compile
        run: corepack enable && pnpm install --frozen-lockfile && pnpm build
